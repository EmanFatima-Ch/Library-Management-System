name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-cd-pipeline:
    name: CI/CD Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project requirements
        run: python -m pip install -r requirements.txt

      - name: Run flake8
        run: python -m flake8 .

      - name: Run pytest suite
        run: python -m pytest -c pytest.ini tests/
